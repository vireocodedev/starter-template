name: Support evidence

on:
  schedule:
    - cron: "53 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: support-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  platform-policy-sync:
    name: Canonical platform policy sync
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the Template snapshot with Starter main
        run: |
          curl --fail --silent --show-error \
            https://raw.githubusercontent.com/vireocodedev/starter/main/contracts/platform-support-policy.json \
            --output "$RUNNER_TEMP/platform-support-policy.json"
          node scripts/platform-support-policy.mjs --compare "$RUNNER_TEMP/platform-support-policy.json"
      - name: Record evidence
        if: always()
        env:
          VIREO_EVIDENCE_COMMAND: compare Template platform policy with public Starter main
          VIREO_EVIDENCE_CANONICAL_SOURCE: https://github.com/vireocodedev/starter/blob/main/contracts/platform-support-policy.json
        run: node scripts/write-support-evidence.mjs platform-policy-sync ${{ job.status }} .support-evidence/platform-policy-sync.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: support-platform-policy-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: .support-evidence/platform-policy-sync.json
          if-no-files-found: error
          retention-days: 90

  java-25:
    name: Java 25 compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Java 21 compiler toolchain
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - name: Select the Java 25 test runtime
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: ./gradlew clean build -PvireoTestJavaVersion=25 --no-build-cache
      - name: Record evidence
        if: always()
        env:
          VIREO_EVIDENCE_COMMAND: ./gradlew clean build -PvireoTestJavaVersion=25 --no-build-cache
          VIREO_EVIDENCE_JAVA_TARGET: "25"
        run: node scripts/write-support-evidence.mjs java-25 ${{ job.status }} .support-evidence/java-25.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: support-java-25-${{ github.run_id }}-${{ github.run_attempt }}
          path: .support-evidence/java-25.json
          if-no-files-found: error
          retention-days: 14

  browsers:
    name: ${{ matrix.browser }} browser compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          registry-url: https://registry.npmjs.org
          scope: "@vireocodedev"
      - run: corepack npm ci
        working-directory: frontend
      - run: corepack npm exec -- playwright install --with-deps ${{ matrix.browser }}
        working-directory: frontend
      - name: Run full-stack browser smoke tests
        env:
          VIREO_E2E_BROWSER: ${{ matrix.browser }}
        run: corepack npm run test:e2e
        working-directory: frontend
      - name: Record evidence
        if: always()
        env:
          VIREO_EVIDENCE_BROWSER: ${{ matrix.browser }}
          VIREO_EVIDENCE_COMMAND: corepack npm run test:e2e
        run: node scripts/write-support-evidence.mjs browser-${{ matrix.browser }} ${{ job.status }} .support-evidence/browser-${{ matrix.browser }}.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: support-browser-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .support-evidence/browser-${{ matrix.browser }}.json
          if-no-files-found: error
          retention-days: 14

  postgres:
    name: PostgreSQL ${{ matrix.postgresql }} full-stack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        postgresql: ["17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgresql }}-alpine
        env:
          POSTGRES_DB: starter_template
          POSTGRES_USER: starter_template
          POSTGRES_PASSWORD: support-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starter_template -d starter_template"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          registry-url: https://registry.npmjs.org
          scope: "@vireocodedev"
      - run: corepack npm ci
        working-directory: frontend
      - run: corepack npm exec -- playwright install --with-deps chromium
        working-directory: frontend
      - name: Exercise migrations and CRUD through the real application
        env:
          VIREO_E2E_EXTERNAL_DATABASE: "true"
          SPRING_PROFILES_ACTIVE: dev
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/starter_template
          SPRING_DATASOURCE_USERNAME: starter_template
          SPRING_DATASOURCE_PASSWORD: support-only-password
        run: corepack npm run test:e2e
        working-directory: frontend
      - name: Resolve tested image digest
        if: always()
        run: echo "VIREO_EVIDENCE_IMAGE=$(docker image inspect postgres:${{ matrix.postgresql }}-alpine --format '{{index .RepoDigests 0}}')" >> "$GITHUB_ENV"
      - name: Record evidence
        if: always()
        env:
          VIREO_EVIDENCE_COMMAND: corepack npm run test:e2e
          VIREO_EVIDENCE_DATABASE_MODE: full-stack-dev-profile
          VIREO_EVIDENCE_POSTGRESQL: ${{ matrix.postgresql }}
        run: node scripts/write-support-evidence.mjs postgres-${{ matrix.postgresql }} ${{ job.status }} .support-evidence/postgres-${{ matrix.postgresql }}.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: support-postgres-${{ matrix.postgresql }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .support-evidence/postgres-${{ matrix.postgresql }}.json
          if-no-files-found: error
          retention-days: 14

  database-recovery:
    name: PostgreSQL 17 to 18 recovery rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Back up PostgreSQL 17 and recover on PostgreSQL 18
        run: ./scripts/verify-database-recovery.sh
      - name: Record evidence
        if: always()
        env:
          VIREO_EVIDENCE_COMMAND: ./scripts/verify-database-recovery.sh
          VIREO_EVIDENCE_SOURCE_POSTGRESQL: "17"
          VIREO_EVIDENCE_TARGET_POSTGRESQL: "18"
          VIREO_EVIDENCE_DATABASE_MODE: logical-backup-restore-and-production-readiness
        run: node scripts/write-support-evidence.mjs database-recovery ${{ job.status }} .support-evidence/database-recovery.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: support-database-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: .support-evidence/database-recovery.json
          if-no-files-found: error
          retention-days: 90
