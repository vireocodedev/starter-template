name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          registry-url: https://registry.npmjs.org
          scope: "@vireocodedev"

      - name: Install frontend dependencies
        working-directory: frontend
        run: corepack npm ci

      - name: Install Chromium
        working-directory: frontend
        run: corepack npm exec -- playwright install --with-deps chromium

      - name: Run authoritative verification
        run: ./scripts/verify.sh silent

      - name: Upload verification timing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: .verification-evidence/latest.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Validate deployment descriptor
        env:
          POSTGRES_PASSWORD: ci-only-password
        run: docker compose config --quiet

      - name: Verify production-like deployment
        env:
          POSTGRES_PASSWORD: ci-only-password
        run: ./scripts/verify-deployment.sh

      - name: Upload browser traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
