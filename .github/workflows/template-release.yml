name: Template release

on:
  push:
    branches: [main]
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Historical immutable recovery tag (only starter-template@0.6.0)
        required: false
        type: string
      reconcile:
        description: Scan durable annotated Template tags for absent or draft releases.
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  # GitHub replaces pending entries in a repository-global group. Publication
  # identity and exact live-state checks provide the race guard; this group only
  # serializes retries of the same source transaction.
  group: template-release-${{ github.event_name == 'push' && github.sha || inputs.tag || github.event_name == 'schedule' && 'durable-scan' || 'manual-scan' }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      action: ${{ steps.live-state.outputs.action }}
      commit: ${{ steps.live-state.outputs.commit }}
      release: ${{ steps.live-state.outputs.release }}
      coordinates_changed: ${{ steps.coordinates.outputs.changed }}
    steps:
      - name: Checkout pushed main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up release planner Node.js without package caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - name: Validate release intent
        run: node scripts/template-release-policy.mjs
      - name: Detect release-coordinate change
        id: coordinates
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          test "$AFTER" = "$(git rev-parse HEAD)"
          case "$BEFORE" in
            0000000000000000000000000000000000000000) echo 'changed=false' >> "$GITHUB_OUTPUT" ;;
            *)
              git cat-file -e "$BEFORE:contracts/template-release-policy.json"
              git show "$BEFORE:contracts/template-release-policy.json" > "$RUNNER_TEMP/template-release-policy-before.json"
              changed="$(node scripts/template-release-coordinate-change.mjs "$RUNNER_TEMP/template-release-policy-before.json")"
              test "$changed" = true || test "$changed" = false
              echo "changed=$changed" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - name: Fetch main ancestry
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Require prepared public artifact binding for a successor
        env:
          COORDINATES_CHANGED: ${{ steps.coordinates.outputs.changed }}
        run: |
          if test "$COORDINATES_CHANGED" = true; then
            node scripts/write-template-release-manifest.mjs "$RUNNER_TEMP/prepared-template-release-manifest.json" "$(git rev-parse HEAD)"
            test "$(node -p 'require(process.argv[1]).schemaVersion' "$RUNNER_TEMP/prepared-template-release-manifest.json")" = 2
          fi
      - name: Read live release state and plan
        id: live-state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/template-release-state.mjs "$RUNNER_TEMP/template-release-state.json" "${{ steps.coordinates.outputs.changed }}" > "$RUNNER_TEMP/template-release-plan.out"
          cat "$RUNNER_TEMP/template-release-plan.out"
          sed -n 's/^action=//p' "$RUNNER_TEMP/template-release-plan.out" | tail -n 1 | sed 's/^/action=/' >> "$GITHUB_OUTPUT"
          sed -n 's/^commit=//p' "$RUNNER_TEMP/template-release-plan.out" | tail -n 1 | sed 's/^/commit=/' >> "$GITHUB_OUTPUT"
          node -e 'const state = require(process.argv[1]); if (state.plan.release) process.stdout.write(`release=${state.plan.release}\n`)' "$RUNNER_TEMP/template-release-state.json" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: github.event_name == 'push' && needs.plan.outputs.action != 'no-op'
    runs-on: ubuntu-24.04
    environment: template-release
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout verified main release target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Require unchanged release target
        env:
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          test "$RELEASE_COMMIT" = "$(git rev-parse HEAD)"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          node scripts/template-release-policy.mjs
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: corepack npm run setup
      - run: corepack npm exec -- playwright install --with-deps chromium
        working-directory: frontend
      - name: Verify exact release target before mutation
        env:
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: env GITHUB_SHA="$RELEASE_COMMIT" ./scripts/verify-template.sh silent
      - name: Write exact release manifest
        env:
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: node scripts/write-template-release-manifest.mjs "$RUNNER_TEMP/template-release-manifest.json" "$RELEASE_COMMIT"
      - name: Recheck live state after verification
        id: recheck
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/template-release-state.mjs "$RUNNER_TEMP/template-release-state-after-verify.json" "${{ needs.plan.outputs.coordinates_changed }}" > "$RUNNER_TEMP/template-release-plan-after-verify.out"
          cat "$RUNNER_TEMP/template-release-plan-after-verify.out"
          sed -n 's/^action=//p' "$RUNNER_TEMP/template-release-plan-after-verify.out" | tail -n 1 | sed 's/^/action=/' >> "$GITHUB_OUTPUT"
      - name: Create annotated immutable release tag through GitHub REST
        if: steps.recheck.outputs.action == 'create-tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          # Refuse a release superseded by a newer main release policy only at
          # the durable tag boundary; tagged recovery is subsequently tag-owned.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          release_tag="$(node -p 'require("./contracts/template-release-policy.json").tag')"
          test "$release_tag" = "$(git show origin/main:contracts/template-release-policy.json | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0,"utf8")).tag)')"
          release_tag="$(node -p 'require("./contracts/template-release-policy.json").tag')"
          tag_object="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$release_tag" -f message="Release $release_tag" -f object="$RELEASE_COMMIT" -f type=commit --jq .sha)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$release_tag" -f sha="$tag_object" >/dev/null
      - name: Refuse tag-creation races and resolve release recovery state
        id: recovery-state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force origin
          for attempt in 1 2 3 4 5 6; do
            if node scripts/template-release-state.mjs "$RUNNER_TEMP/template-release-state-before-release.json" "${{ needs.plan.outputs.coordinates_changed }}" > "$RUNNER_TEMP/template-release-plan-before-release.out"; then
              cat "$RUNNER_TEMP/template-release-plan-before-release.out"
              action="$(node -p 'require(process.argv[1]).plan.action' "$RUNNER_TEMP/template-release-state-before-release.json")"
              if test "$action" = 'recover-release' || test "$action" = 'no-op'; then
                echo "action=$action" >> "$GITHUB_OUTPUT"
                node -e 'const state = require(process.argv[1]); if (state.plan.release) process.stdout.write(`release=${state.plan.release}\n`)' "$RUNNER_TEMP/template-release-state-before-release.json" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            echo "Release-state planner attempt $attempt did not reach a safe recovery state." >&2
            test "$attempt" = 6 && exit 1
            sleep 10
          done
      - name: Require safe draft recovery state
        env:
          ACTION: ${{ steps.recovery-state.outputs.action }}
        run: test "$ACTION" = 'recover-release' || test "$ACTION" = 'no-op'
      - name: Create draft release and attach manifest
        if: steps.recovery-state.outputs.action == 'recover-release' && steps.recovery-state.outputs.release == 'absent'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="$(node -p 'require("./contracts/template-release-policy.json").tag')"
          gh release create "$release_tag" "$RUNNER_TEMP/template-release-manifest.json" --draft --generate-notes --verify-tag --title "$release_tag"
      - name: Validate draft manifest before publication
        id: draft-state
        if: steps.recovery-state.outputs.action != 'no-op'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/template-release-state.mjs "$RUNNER_TEMP/template-release-state-draft.json" "${{ needs.plan.outputs.coordinates_changed }}" > "$RUNNER_TEMP/template-release-plan-draft.out"; then
              cat "$RUNNER_TEMP/template-release-plan-draft.out"
              action="$(node -p 'require(process.argv[1]).plan.action' "$RUNNER_TEMP/template-release-state-draft.json")"
              release="$(node -p 'require(process.argv[1]).plan.release || ""' "$RUNNER_TEMP/template-release-state-draft.json")"
              if test "$action" = 'no-op' || { test "$action" = 'recover-release' && test "$release" = 'draft'; }; then
                echo "action=$action" >> "$GITHUB_OUTPUT"
                echo "release=$release" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            echo "Draft-state planner attempt $attempt did not observe a validated draft." >&2
            test "$attempt" = 6 && exit 1
            sleep 10
          done
      - name: Publish validated draft release
        if: steps.draft-state.outputs.action == 'recover-release'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ steps.draft-state.outputs.action }}
          RELEASE_STATE: ${{ steps.draft-state.outputs.release }}
        run: |
          test "$ACTION" = 'recover-release'
          test "$RELEASE_STATE" = 'draft'
          release_tag="$(node -p 'require("./contracts/template-release-policy.json").tag')"
          gh release edit "$release_tag" --draft=false --latest=false
      - name: Verify immutable published release and exact manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/template-release-state.mjs "$RUNNER_TEMP/template-release-state-final.json" "${{ needs.plan.outputs.coordinates_changed }}" > "$RUNNER_TEMP/template-release-plan-final.out"; then
              cat "$RUNNER_TEMP/template-release-plan-final.out"
              if test "$(sed -n 's/^action=//p' "$RUNNER_TEMP/template-release-plan-final.out" | tail -n 1)" = 'no-op'; then
                exit 0
              fi
            fi
            echo "Final release-state planner attempt $attempt did not observe immutable publication." >&2
            test "$attempt" = 6 && exit 1
            sleep 10
          done
      - name: Reconcile and verify GitHub latest after immutable publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_tag="$(node scripts/template-release-reconciliation.mjs latest)"
          gh release edit "$latest_tag" --latest
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$latest_tag"

  historical-recovery:
    if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
    runs-on: ubuntu-24.04
    environment: template-release
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout main recovery policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Resolve pinned historical recovery target
        id: recovery
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/main'
          node scripts/template-release-recovery-policy.mjs "$GITHUB_OUTPUT" "$RELEASE_TAG"
      - name: Require exact live wildcard tag protection before recovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/template-release-state.mjs "$RUNNER_TEMP/template-release-state-historical-preflight.json" false
      - name: Require exact immutable historical tag
        env:
          RELEASE_TAG: ${{ steps.recovery.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.recovery.outputs.commit }}
        run: |
          git fetch --tags --force origin
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
      - name: Checkout exact historical target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.recovery.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: corepack npm run setup
      - run: corepack npm exec -- playwright install --with-deps chromium
        working-directory: frontend
      - name: Verify historical target before mutation
        env:
          RELEASE_COMMIT: ${{ steps.recovery.outputs.commit }}
        run: env GITHUB_SHA="$RELEASE_COMMIT" ./scripts/verify-template.sh silent
      - name: Create historical release only when absent
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.recovery.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.recovery.outputs.commit }}
        run: |
          release_view="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" 2>&1)" && exit 1
          printf '%s' "$release_view" | grep -Fqi 'release not found'
          node scripts/write-template-release-manifest.mjs "$RUNNER_TEMP/template-release-manifest.json" "$RELEASE_COMMIT"
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/template-release-manifest.json" --draft --generate-notes --verify-tag --title "$RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --draft=false --latest=false

  scan-durable-releases:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.reconcile) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.tags.outputs.matrix }}
      has_tags: ${{ steps.tags.outputs.has_tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - name: Produce every automation-era durable tag for fail-closed exact validation
        id: tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force origin +refs/heads/main:refs/remotes/origin/main
          node scripts/template-release-reconciliation.mjs scan > "$RUNNER_TEMP/durable-tags.json"
          node -e 'const tags=require(process.argv[1]);process.stdout.write(JSON.stringify({include:tags.map(tag=>({tag}))}))' "$RUNNER_TEMP/durable-tags.json" | sed 's/^/matrix=/' >> "$GITHUB_OUTPUT"
          node -e 'process.stdout.write(require(process.argv[1]).length ? "true" : "false")' "$RUNNER_TEMP/durable-tags.json" | sed 's/^/has_tags=/' >> "$GITHUB_OUTPUT"

  recover-durable-tags:
    needs: scan-durable-releases
    if: ${{ needs.scan-durable-releases.outputs.has_tags == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.scan-durable-releases.outputs.matrix) }}
    uses: ./.github/workflows/template-release-recover.yml
    permissions:
      contents: write
    with:
      tag: ${{ matrix.tag }}

  reconcile-durable-latest:
    needs: [scan-durable-releases, recover-durable-tags]
    if: ${{ always() && needs.scan-durable-releases.result == 'success' && (needs.recover-durable-tags.result == 'success' || needs.recover-durable-tags.result == 'skipped') }}
    runs-on: ubuntu-24.04
    environment: template-release
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - name: Independently reconcile and verify GitHub latest after all exact conclusions
        id: latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force origin +refs/heads/main:refs/remotes/origin/main
          latest_tag="$(node scripts/template-release-reconciliation.mjs latest)"
          gh release edit "$latest_tag" --latest
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$latest_tag"
          echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"
      - name: Compare the newest eligible immutable release with public deployment proof
        id: flagship-proof
        env:
          RELEASE_TAG: ${{ steps.latest.outputs.tag }}
          VIREO_DEMO_BASE_URL: ${{ vars.VIREO_DEMO_BASE_URL }}
        run: |
          # Older releases predate the exact-tag flagship workflow inputs. They
          # remain eligible for GitHub latest, but cannot be dispatched here.
          if ! node scripts/template-release-reconciliation.mjs assert-automation-tag "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'dispatch=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          release_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          release="$(git show "$release_commit:contracts/template-release-policy.json" | node -e '
            const source = require("fs").readFileSync(0, "utf8");
            const policy = JSON.parse(source);
            const tag = process.env.RELEASE_TAG;
            const expected = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/tag/${encodeURIComponent(tag)}`;
            if (policy.repository !== process.env.GITHUB_REPOSITORY || policy.tag !== tag || policy.releaseUrl !== expected) throw new Error("tag-owned policy does not bind the exact public release");
            process.stdout.write(policy.releaseUrl);
          ')"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          proof="${VIREO_DEMO_BASE_URL%/}/.well-known/vireo-deployment.json"
          if test -n "$VIREO_DEMO_BASE_URL" && curl --fail --silent --show-error "$proof" | RELEASE_COMMIT="$release_commit" node -e '
            const chunks = [];
            process.stdin.on("data", (chunk) => chunks.push(chunk));
            process.stdin.on("end", () => {
              try { process.exit(JSON.parse(Buffer.concat(chunks)).commit === process.env.RELEASE_COMMIT ? 0 : 1); }
              catch { process.exit(1); }
            });
          '; then
            echo 'dispatch=false' >> "$GITHUB_OUTPUT"
          else
            # Before the first blue/green cutover the proof is deliberately
            # absent. Afterwards, an unavailable or mismatched proof is also a
            # safe reason to dispatch only this highest immutable release.
            echo 'dispatch=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Dispatch the newest eligible immutable release when proof differs or is unavailable
        if: steps.flagship-proof.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.flagship-proof.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.flagship-proof.outputs.commit }}
          RELEASE_URL: ${{ steps.flagship-proof.outputs.release }}
        run: |
          gh workflow run flagship-demo.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG" -f mode=deploy -f tag="$RELEASE_TAG" -f commit="$RELEASE_COMMIT" -f release="$RELEASE_URL"

  dispatch-flagship-demo:
    needs: [plan, release]
    # A rerun of the exact coordinate-changing push has plan=no-op after a
    # successful publication. Revalidate immutable state and dispatch again so
    # an interrupted first dispatch never loses the release deployment.
    if: ${{ always() && !cancelled() && github.event_name == 'push' && needs.plan.outputs.coordinates_changed == 'true' && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the final immutable published release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          test "$RELEASE_COMMIT" = "$(git rev-parse HEAD)"
          node scripts/template-release-state.mjs "$RUNNER_TEMP/template-release-state-before-flagship-dispatch.json" true > "$RUNNER_TEMP/template-release-state-before-flagship-dispatch.out"
          test "$(sed -n 's/^action=//p' "$RUNNER_TEMP/template-release-state-before-flagship-dispatch.out" | tail -n 1)" = no-op
      - name: Dispatch the exact immutable release deployment
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          tag="$(node -p 'require("./contracts/template-release-policy.json").tag')"
          release="$(node -p 'require("./contracts/template-release-policy.json").releaseUrl')"
          gh workflow run flagship-demo.yml --repo "$GITHUB_REPOSITORY" --ref "$tag" -f mode=deploy -f tag="$tag" -f commit="$RELEASE_COMMIT" -f release="$release"
