name: Template release

on:
  push:
    tags: ["starter-template@*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable release tag to publish from main
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: template-release
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout policy source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Reject non-main recovery dispatch
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = "refs/heads/main"
      - name: Validate current release policy
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/template-release-policy.mjs "$RELEASE_TAG"
      - name: Resolve trusted recovery target
        id: release-target
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/template-release-recovery-policy.mjs "$GITHUB_OUTPUT" "$RELEASE_TAG"
      - name: Resolve pushed release target
        id: pushed-release-target
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Require release absence before checkout
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-target.outputs.tag || steps.pushed-release-target.outputs.tag }}
        run: |
          release_view="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" 2>&1)" && {
            printf '%s\n' "$release_view"
            echo "A draft or published release already exists for $RELEASE_TAG."
            exit 1
          }
          if ! printf '%s' "$release_view" | grep -Fqi "release not found"; then
            printf '%s\n' "$release_view"
            echo "Unable to prove that no release exists for $RELEASE_TAG."
            exit 1
          fi
      - name: Require trusted remote tag target before checkout
        env:
          RELEASE_TAG: ${{ steps.release-target.outputs.tag || steps.pushed-release-target.outputs.tag }}
          EXPECTED_COMMIT: ${{ steps.release-target.outputs.commit || steps.pushed-release-target.outputs.commit }}
        run: |
          remote_commit="$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | awk '{print $1}')"
          test "$remote_commit" = "$EXPECTED_COMMIT"
      - name: Checkout validated release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.release-target.outputs.tag || steps.pushed-release-target.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve exact release target
        env:
          RELEASE_TAG: ${{ steps.release-target.outputs.tag || steps.pushed-release-target.outputs.tag }}
          EXPECTED_COMMIT: ${{ steps.release-target.outputs.commit || steps.pushed-release-target.outputs.commit }}
        run: |
          tag_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          test "$tag_commit" = "$EXPECTED_COMMIT"
          test "$head_commit" = "$EXPECTED_COMMIT"
          node scripts/template-release-policy.mjs "$RELEASE_TAG"
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: corepack npm run setup
      - run: corepack npm exec -- playwright install --with-deps chromium
        working-directory: frontend
      - name: Verify exact release target
        env:
          RELEASE_COMMIT: ${{ steps.release-target.outputs.commit || steps.pushed-release-target.outputs.commit }}
        run: env GITHUB_SHA="$RELEASE_COMMIT" ./scripts/verify-template.sh silent
      - run: node scripts/write-template-release-manifest.mjs "$RUNNER_TEMP/template-release-manifest.json" "${{ steps.release-target.outputs.commit || steps.pushed-release-target.outputs.commit }}"
      - name: Revalidate release absence and exact tag target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-target.outputs.tag || steps.pushed-release-target.outputs.tag }}
          EXPECTED_COMMIT: ${{ steps.release-target.outputs.commit || steps.pushed-release-target.outputs.commit }}
        run: |
          release_view="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" 2>&1)" && {
            printf '%s\n' "$release_view"
            echo "A draft or published release already exists for $RELEASE_TAG."
            exit 1
          }
          if ! printf '%s' "$release_view" | grep -Fqi "release not found"; then
            printf '%s\n' "$release_view"
            echo "Unable to prove that no release exists for $RELEASE_TAG."
            exit 1
          fi
          remote_commit="$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | awk '{print $1}')"
          test "$remote_commit" = "$EXPECTED_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - run: gh release create "${{ steps.release-target.outputs.tag || steps.pushed-release-target.outputs.tag }}" "$RUNNER_TEMP/template-release-manifest.json" --draft --generate-notes --verify-tag --title "${{ steps.release-target.outputs.tag || steps.pushed-release-target.outputs.tag }}"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh release edit "${{ steps.release-target.outputs.tag || steps.pushed-release-target.outputs.tag }}" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
