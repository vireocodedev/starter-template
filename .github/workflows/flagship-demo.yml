name: Flagship demo

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: flagship-demo
  cancel-in-progress: true

jobs:
  synthetic-journey:
    if: ${{ vars.VIREO_DEMO_BASE_URL != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: corepack npm ci --prefix frontend

      - name: Install Chromium
        working-directory: frontend
        run: corepack npm exec -- playwright install --with-deps chromium

      - name: Verify public health boundaries
        env:
          VIREO_DEMO_BASE_URL: ${{ vars.VIREO_DEMO_BASE_URL }}
        run: |
          curl --fail --silent --show-error --retry 3 "${VIREO_DEMO_BASE_URL}/healthz"
          curl --fail --silent --show-error --retry 3 "${VIREO_DEMO_BASE_URL}/actuator/health/readiness" | grep --quiet '"status":"UP"'

      - name: Exercise public evaluation journey
        env:
          VIREO_DEMO_BASE_URL: ${{ vars.VIREO_DEMO_BASE_URL }}
          VIREO_DEMO_USERNAME: ${{ vars.VIREO_DEMO_USERNAME }}
          VIREO_DEMO_PASSWORD: ${{ secrets.VIREO_DEMO_PASSWORD }}
        run: corepack npm --prefix frontend run test:demo

      - name: Upload failed journey trace
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flagship-demo-trace-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 14
