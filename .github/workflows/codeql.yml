name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1"

permissions:
  contents: read
  packages: read
  actions: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      VIREO_PACKAGES_TOKEN: ${{ secrets.VIREO_PACKAGES_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.VIREO_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.VIREO_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"

      - name: Validate private JVM package credentials
        run: ./scripts/require-ci-package-token.sh

      - run: npm ci
        working-directory: frontend

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin,javascript-typescript

      - uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4
