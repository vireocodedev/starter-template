name: Feature request
description: Propose a change to the reusable Template baseline
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and considered whether this belongs in an application or reusable Starter package.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and users
      description: Describe the concrete onboarding or application-foundation problem.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the smallest reusable Template outcome.
    validations:
      required: true
  - type: textarea
    id: ownership
    attributes:
      label: Responsibility boundary and alternatives
      description: Explain why this belongs in the Template and any application or Starter-package alternative.
    validations:
      required: true
  - type: textarea
    id: migration
    attributes:
      label: Compatibility and migration impact
      description: Cover configuration, schema, generated code, dependencies, and existing clones where relevant.
