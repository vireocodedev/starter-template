plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'com.vireocode'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

repositories {
    def useLocalStarter = providers.gradleProperty('useLocalStarter')
        .map { it.toBoolean() }
        .orElse(false)
        .get()

    if (useLocalStarter) {
        mavenLocal()
    }

    def gprUser = System.getenv('GITHUB_ACTOR') ?: findProperty('gpr.user')
    def gprKey = System.getenv('GITHUB_TOKEN') ?: findProperty('gpr.key')
    if (gprUser && gprKey) {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/vireocodedev/starter')
            credentials {
                username = gprUser
                password = gprKey
            }
        }
    }

    mavenCentral()
}

dependencies {
    implementation platform("com.vireocode:vireo-starter-bom:${starterVersion}")
    implementation 'com.vireocode:vireo-starter-core'
    implementation 'com.vireocode:vireo-starter-auth'
    implementation 'com.vireocode:vireo-starter-queryengine'
    implementation 'com.vireocode:vireo-starter-history'

    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.session:spring-session-jdbc'
    implementation 'org.mapstruct:mapstruct:1.6.0'
    compileOnly 'org.projectlombok:lombok'
    compileOnly 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.0'

    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register('copyFrontend', Copy) {
    dependsOn ':frontendBuild'
    from 'frontend/dist'
    into layout.buildDirectory.dir('resources/main/static')
}

tasks.register('frontendBuild', Exec) {
    workingDir 'frontend'
    commandLine 'npm', 'run', 'build'
}

tasks.named('processResources') {
    dependsOn tasks.named('copyFrontend')
}

tasks.named('bootRun') {
    systemProperty 'spring.profiles.active', System.getProperty('spring.profiles.active', 'dev')
}
