services:
  postgres:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-starter_template}
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-starter_template_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?Set POSTGRES_OWNER_PASSWORD}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-starter_template_runtime}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?Set POSTGRES_RUNTIME_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/postgres/init-runtime-role.sh:/docker-entrypoint-initdb.d/10-runtime-role.sh:ro

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-starter_template}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_RUNTIME_USER:-starter_template_runtime}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?Set POSTGRES_RUNTIME_PASSWORD}
      SPRING_FLYWAY_USER: ${POSTGRES_OWNER_USER:-starter_template_owner}
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?Set POSTGRES_OWNER_PASSWORD}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
    healthcheck:
      test: ["CMD", "/usr/local/bin/backend-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://127.0.0.1:8080/healthz",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"

volumes:
  postgres-data:
