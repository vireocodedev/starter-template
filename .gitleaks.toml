title = "Vireo Template secret-scanning policy"

[extend]
useDefault = true

[[allowlists]]
description = "Ignore release-security prose that matches the generic API key rule"
condition = "AND"
regexTarget = "line"
regexes = ["secret scans, signed/provenanced releases"]
paths = ['''^docs/security-threat-model\.md$''']

[[allowlists]]
description = "Ignore the same prose in the one policy commit that asserted the allowlist"
condition = "AND"
commits = ["a0657624120da26c2b22cbb634db9063ea070201"]
regexTarget = "line"
regexes = ["secret scans, signed/provenanced releases"]
paths = ['''^scripts/workflow-security-policy\.mjs$''']

[[allowlists]]
description = "Treat the pinned create-github-app-token action commit as public workflow metadata"
condition = "AND"
regexTarget = "line"
regexes = ['''"actions/create-github-app-token": "[a-f0-9]{40}"''']
paths = ['''^contracts/github-actions-policy\.json$''']
